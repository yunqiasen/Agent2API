services:
  agent2api:
    image: agent2api:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent2api
    restart: unless-stopped
    ports:
      - "8530:8530"
    volumes:
      - agent2api-data:/data
    environment:
      TZ: Asia/Shanghai
      AGENT2API_HOST: "0.0.0.0"
      AGENT2API_PORT: "8530"
      AGENT2API_THREADS: "16"
      AGENT2API_DATA_DIR: "/data"
      AGENT2API_ADMIN_PASSWORD: "${AGENT2API_ADMIN_PASSWORD:?set AGENT2API_ADMIN_PASSWORD in .env}"
      AGENT2API_DEFAULT_KEY: "${AGENT2API_DEFAULT_KEY:?set AGENT2API_DEFAULT_KEY in .env}"
      AGENT2API_SECRET: "${AGENT2API_SECRET:-}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,sys,urllib.request; port=os.environ.get('AGENT2API_PORT','8530'); r=urllib.request.urlopen('http://127.0.0.1:'+port+'/health',timeout=4); sys.exit(0 if r.status==200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  agent2api-data:
